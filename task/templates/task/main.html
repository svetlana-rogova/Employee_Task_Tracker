<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Задачи{% endblock %}</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet"/>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Меню -->
        <div class="col-2 bg-dark text-white p-2 d-flex flex-column min-vh-100">
            <nav class="nav flex-column">
                <h3>
                    <i class="bi bi-bootstrap-fill"></i>
                    Меню
                </h3>
                <hr>
                <a class="nav-link text-white" href="{% url 'task:home' %}">
                    <i class="bi bi-bookmark"></i>
                    Все задачи
                </a>
                <a class="nav-link text-white" href="{% url 'task:add_task' %}">
                    <i class="bi bi-bookmark-plus"></i>
                    Добавить задачу
                </a>
                <a class="nav-link text-white" href="{% url 'task:important' %}">
                    <i class="bi bi-bookmark-star"></i>
                    Важные задачи
                </a>
                <a class="nav-link text-white" href="{% url 'task:employee' %}">
                    <i class="bi bi-person-lines-fill"></i>
                    Сотрудники
                </a>
            </nav>
            <div class="text-white mt-auto ps-2">
                <hr>
                <div class="dropup-center dropup">
                    <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                        Пользователь
                    </button>
                </div>
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
