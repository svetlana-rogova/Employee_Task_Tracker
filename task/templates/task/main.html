<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Задачи{% endblock %}</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet"/>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
            rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Меню -->
        <div class="col-2 bg-info text-black p-2 d-flex flex-column min-vh-100">
            <nav class="nav flex-column">
                <h3>
                    <i class="bi bi-list-task"></i>
                    Меню
                </h3>
                <hr>
                <a class="nav-link text-black" href="{% url 'task:home' %}">
                    <i class="bi bi-bookmark"></i>
                    Все задачи
                </a>
                {% if user.is_authenticated %}
                <a class="nav-link text-black" href="{% url 'task:add_task' %}">
                    <i class="bi bi-bookmark-plus"></i>
                    Добавить задачу
                </a>
                <a class="nav-link text-black" href="{% url 'task:important' %}">
                    <i class="bi bi-bookmark-star"></i>
                    Важные задачи
                </a>
                <a class="nav-link text-black" href="{% url 'task:employee' %}">
                    <i class="bi bi-person-lines-fill"></i>
                    Сотрудники
                </a>
                {% endif %}
            </nav>
            <div class="text-white mt-auto ps-2">
                <hr>
                <div class="dropup-center dropup">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                        Пользователь
                    </button>
                    <ul class="dropdown-menu">
                        {% if user.is_authenticated %}
                            <li>
                                <a class="dropdown-item" href="{% url 'users:profile' %}">
                                    Личный кабинет
                                </a>
                            </li>

                            <li>
                                <form method="post" action="{% url 'users:logout' %}">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item">
                                        Выйти
                                    </button>
                                </form>
                            </li>

                        {% else %}

                            <li>
                                <a class="dropdown-item" href="{% url 'users:login' %}">
                                    Войти
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="{% url 'users:register' %}">
                                    Регистрация
                                </a>
                            </li>

                        {% endif %}
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-10">
            <div class="mx-auto mt-5" style="max-width: 900px;">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
