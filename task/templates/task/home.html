{% extends 'task/main.html' %}
{% block title %}Список задач{% endblock %}

{% block content %}

<div class="col p-4 d-flex flex-column align-items-center">

    <h1 class="text-center mb-4">
        Список всех активных задач
    </h1>

    <table class="table table-striped table-hover" id="task-table">
        <thead>
        <tr>
            <th>Название</th>
            <th>Статус</th>
        </tr>
        </thead>

        <tbody id="task-body">
        </tbody>
    </table>

</div>

<script>
async function loadTasks() {
    const response = await fetch('/api/task/?status=create&status=in_progress');
    const tasks = await response.json();

    const body = document.getElementById('task-body');
    body.innerHTML = '';

    tasks.forEach(task => {
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${task.title}</td>
            <td>${task.status}</td>
            <td>
                <button class="btn btn-sm btn-warning" onclick="editTask(${task.id})">
                    Изменить
                </button>
            </td>
            <td>
                <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">
                    Удалить
                </button>
            </td>
        `;

        body.appendChild(row);
    });
}

loadTasks();
</script>
{% endblock %}
