{% extends 'task/main.html' %}
{% block title %}Список задач{% endblock %}

{% block content %}

<div class="col p-4 d-flex flex-column align-items-center">

    <h1 class="text-center mb-4">
        Список всех активных задач
    </h1>

    <table class="table table-striped table-hover" id="task-table">
        <thead>
        <tr>
            <th>Название</th>
            <th>Статус</th>
            <th>Срок выполнения</th>
        </tr>
        </thead>

        <tbody id="task-body">
        </tbody>
    </table>

</div>

<script>
const STATUS_MAP = {
    created: 'Создана',
    in_progress: 'В работе',
    done: 'Завершена'
};

const PAGE_SIZE = 10;

function getCookie(name) {
    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');

        for (let cookie of cookies) {
            cookie = cookie.trim();

            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }

    return cookieValue;
}

function deleteTask(id) {
    if (!confirm("Удалить задачу?")) return;

    fetch(`/api/task/${id}/`, {
        method: 'DELETE',
        headers: {
            'X-CSRFToken': getCookie('csrftoken')
        }
    }).then(() => loadTasks());
}

async function loadTasks(page = 1) {
    const response = await fetch(`/api/task/?page=${page}`);
    const data = await response.json();

    const body = document.getElementById('task-body');
    body.innerHTML = '';

    data.results.forEach(task => {
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${task.title}</td>
            <td>${STATUS_MAP[task.status]}</td>
            <td>${new Date(task.period).toLocaleString('ru-RU')}</td>
            <td>
                ${task.can_edit ? `<a class="btn btn-warning btn-sm" href="/task/${task.id}/edit/">Изменить</a>` : ''}
                ${task.can_delete ? `<button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">Удалить</button>` : ''}
            </td>
        `;

        body.appendChild(row);
    });

    renderPagination(data, page);
}

function renderPagination(data, page) {
    const container = document.getElementById('pagination');
    container.innerHTML = '';

    const totalPages = Math.ceil(data.count / PAGE_SIZE);

    container.innerHTML = `
        <button class="btn btn-sm btn-outline-primary"
            ${!data.previous ? 'disabled' : ''}
            onclick="loadTasks(${page - 1})">
            Prev
        </button>

        ${Array.from({ length: totalPages }, (_, i) => `
            <button class="btn btn-sm ${i + 1 === page ? 'btn-primary' : 'btn-outline-primary'}"
                onclick="loadTasks(${i + 1})">
                ${i + 1}
            </button>
        `).join('')}

        <button class="btn btn-sm btn-outline-primary"
            ${!data.next ? 'disabled' : ''}
            onclick="loadTasks(${page + 1})">
            Next
        </button>
    `;
}

loadTasks(1);
</script>
<div id="pagination" class="mt-3 d-flex gap-2 justify-content-center"></div>
{% endblock %}
